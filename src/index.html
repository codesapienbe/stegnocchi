<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIF Steganography</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
</head>

<body>
    <div id="app" class="app">
        <!-- Main Drop Zone -->
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone__content">
                <!-- Mode Indicator -->
                <div class="mode-indicator" id="modeIndicator">
                    <div class="mode-icon" id="modeIcon">
                        <svg class="icon-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="16" y1="13" x2="8" y2="13" />
                            <line x1="16" y1="17" x2="8" y2="17" />
                            <polyline points="10 9 9 9 8 9" />
                        </svg>
                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                            <path class="hide-slash" d="m15 9-6 6" />
                        </svg>
                        <svg class="icon-extract" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="m7 11V7a5 5 0 0 1 10 0v4" />
                            <circle cx="12" cy="16" r="1" />
                        </svg>
                    </div>
                    <div class="mode-text" id="modeText">Drop Image Here</div>
                    <div class="mode-subtext" id="modeSubtext">Swipe up to hide • Swipe down to extract</div>
                </div>

                <!-- Image Preview -->
                <div class="image-preview" id="imagePreview">
                    <img id="previewImage" alt="Selected image" />
                    <div class="image-overlay" id="imageOverlay">
                        <div class="scanning-line" id="scanningLine"></div>
                        <div class="data-particles" id="dataParticles"></div>
                    </div>
                </div>

                <!-- Progress Ring -->
                <div class="progress-ring" id="progressRing">
                    <svg class="progress-ring__circle" width="120" height="120">
                        <circle class="progress-ring__circle-bg" stroke="currentColor" stroke-width="4"
                            fill="transparent" r="52" cx="60" cy="60" />
                        <circle class="progress-ring__circle-progress" stroke="currentColor" stroke-width="4"
                            fill="transparent" r="52" cx="60" cy="60" />
                    </svg>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>
        </div>

        <!-- Floating Input Panel -->
        <div class="floating-input" id="floatingInput">
            <div class="floating-input__handle"></div>
            <div class="floating-input__content">
                <div class="input-group" id="messageGroup">
                    <label for="messageInput" class="input-label">Secret Message</label>
                    <textarea id="messageInput" class="form-control" rows="3" placeholder="Enter your secret message..."
                        maxlength="1000"></textarea>
                    <div class="character-count" id="characterCount">0/1000</div>
                </div>

                <div class="input-group" id="passwordGroup">
                    <label for="passwordInput" class="input-label">Password</label>
                    <input id="passwordInput" type="password" class="form-control" placeholder="Enter password..."
                        autocomplete="off" />
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <button class="btn btn--primary btn--full-width" id="processButton" disabled>
                    <span class="btn-text" id="btnText">Process</span>
                    <div class="btn-spinner" id="btnSpinner">
                        <div class="spinner"></div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Result Card -->
        <div class="result-card" id="resultCard">
            <div class="result-card__content">
                <div class="result-success" id="resultSuccess">
                    <div class="success-icon">✨</div>
                    <h3 class="result-title" id="resultTitle">Success!</h3>
                    <p class="result-message" id="resultMessage">Your message has been processed</p>
                    <div class="result-actions">
                        <button class="btn btn--primary" id="downloadBtn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                            </svg>
                            Download
                        </button>
                        <button class="btn btn--secondary" id="copyBtn">
                            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="m5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            Copy
                        </button>
                    </div>
                </div>
                <div class="result-error" id="resultError">
                    <div class="error-icon">⚠️</div>
                    <h3 class="result-title">Failed</h3>
                    <p class="result-message" id="errorMessage">Something went wrong</p>
                    <button class="btn btn--outline" id="retryBtn">Try Again</button>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="toast" id="toast">
            <div class="toast__content">
                <div class="toast__icon" id="toastIcon">ℹ️</div>
                <span class="toast__message" id="toastMessage">Notification</span>
            </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="fileInput" accept="image/jpeg,.jpg" hidden>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
